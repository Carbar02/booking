spring.application.name=booking
server.port=8081
spring.datasource.url=jdbc:h2:file:./data/booking;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
